name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main  # هيشتغل أول ما ترفعي كود على فرع main

jobs:
  deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
    # 1. تنزيل الكود من GitHub للموظف الآلي
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. تعريف الموظف الآلي بمفاتيح AWS بتاعتك
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # اتأكدي إن دي نفس منطقتك في AWS

    # 3. تسجيل الدخول لمخزن AWS ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # 4. بناء الـ Docker Image ورفعها للمخزن
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: resume-classifier # نفس الاسم اللي كتبتيه في ECR
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG